{% extends 'onlinecourse/base.html' %}{% block content %}<h1>Available Courses</h1><div class="row g-3">{% for course in courses %}<div class="col-md-6"><div class="card shadow-sm"><div class="card-body"><h3>{{ course.name }}</h3><p>{{ course.description }}</p><a class="btn btn-primary" href="{% url 'course_details' course.id %}">View course</a></div></div></div>{% empty %}<p>No courses available. Add one in the admin site.</p>{% endfor %}</div>{% endblock %}
